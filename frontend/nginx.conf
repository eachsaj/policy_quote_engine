# Serves the Angular build and proxies the API to the backend container, so the browser stays
# same-origin (no CORS needed) exactly as with the dev proxy in proxy.conf.json.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /policy/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
  }

  location = /health {
    proxy_pass http://backend:3000;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
